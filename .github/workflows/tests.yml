name: CONCEDE automated tests

on:
  push:
    branches:
      - main
      - feature/concede-mailing-m365
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile application modules
        run: python -m compileall -q app.py core.py radar_ui.py radar_store.py mailing_auth.py mailing_service.py mailing_ui.py
      - name: Run automated tests
        run: pytest -q
